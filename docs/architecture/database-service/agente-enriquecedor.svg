<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 864" role="img" aria-label="Sequência do enriquecimento de um livro pelo agente"><style>text{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:13px}.b{font-weight:700}.sm{font-size:12px}
