xt class="t b" x="1110.0" y="34.5" text-anchor="middle">Catálogos</text><text class="t sm" x="1110.0" y="51.5" text-anchor="middle">Google Books, BrasilAPI</text><path class="ln" d="M90 100L300 100" marker-end="url(#a2)"/><rect class="bg" x="115.25" y="79" width="159.5" height="18"/><text class="t sm" x="195.0" y="92" text-anchor="middle">POST .../enriquecimento</text><path class="ln" d="M300 144L510 144" marker-end="url(#a2)"/><rect class="bg" x="338.25" y="123" width="133.5" height="18"/><text class="t sm" x="405.0" y="136" text-anchor="middle">livro é deste dono?</text><path class="ln ds" d="M510 188L300 188" marker-end="url(#a2)"/><rect class="bg" x="354.5" y="167" width="101.0" height="18"/><text class="t sm" x="405.0" y="180" text-anchor="middle">livro (ou 404)</text><path class="ln" d="M300 232L720 232" marker-end="url(#a2)"/><rect class="bg" x="414.0" y="211" width="192.0" height="18"/><text class="t sm" x="510.0" y="224" text-anchor="middle">sugerir(livro, texto do OCR)</text><path class="ln red" d="M720 314L930 314" marker-end="url(#r2)"/><rect class="bg" x="758.25" y="293" width="133.5" height="18"/><text class="t sm" x="825.0" y="306" text-anchor="middle">livro + ferramentas</text><path class="ln ds red" d="M930 358L720 358" marker-end="url(#r2)"/><rect class="bg" x="755.0" y="337" width="140.0" height="18"/><text class="t sm" x="825.0" y="350" text-anchor="middle">chama uma ferramenta</text><path class="ln red" d="M720 402L1110 402" marker-end="url(#r2)"/><rect class="bg" x="815.75" y="381" width="198.5" height="18"/><text class="t sm" x="915.0" y="394" text-anchor="middle">buscarEdicoes · consultarIsbn</text><path class="ln ds red" d="M1110 446L720 446" marker-end="url(#r2)"/><rect class="bg" x="848.25" y="425" width="133.5" height="18"/><text class="t sm" x="915.0" y="438" text-anchor="middle">edições encontradas</text><rect class="st" x="570" y="468" width="300" height="48" rx="4"/><text class="t b" x="720.0" y="488.5" text-anchor="middle">Marca cada edição: confere com o livro?</text><text class="t sm" x="720.0" y="505.5" text-anchor="middle">impressas primeiro · no máximo 2 ISBNs de memória</text><rect class="agr" x="556" y="256" width="636" height="274" rx="6"/><text class="tr b" x="568" y="274" text-anchor="start">repete: até 6 rodadas (na última, só concluir)</text><path class="ln ds red" d="M930 564L720 564" marker-end="url(#r2)"/><rect class="bg" x="735.5" y="543" width="179.0" height="18"/><text class="t sm" x="825.0" y="556" text-anchor="middle">concluir: ISBN, sinopse...</text><path class="ln red" d="M720 608L1110 608" marker-end="url(#r2)"/><rect class="bg" x="747.5" y="587" width="335.0" height="18"/><text class="t sm" x="915.0" y="600" text-anchor="middle">BrasilAPI: confirma o ISBN, se ainda não consultou</text><rect class="ag" x="530" y="628" width="380" height="66" rx="4"/><text class="tw b" x="720.0" y="649.0" text-anchor="middle">O modelo propõe, o código confere</text><text class="tw sm" x="720.0" y="666.0" text-anchor="middle">algum catálogo confirma e nenhum contradiz?</text><text class="tw sm" x="720.0" y="683.0" text-anchor="middle">não: descarta ISBN, páginas e editora</text><path class="ln ds" d="M720 732L300 732" marker-end="url(#a2)"/><rect class="bg" x="407.5" y="711" width="205.0" height="18"/><text class="t sm" x="510.0" y="724" text-anchor="middle">sugestão + fonte de cada campo</text><path class="ln" d="M300 776L510 776" marker-end="url(#a2)"/><rect class="bg" x="341.5" y="755" width="127.0" height="18"/><text class="t sm" x="405.0" y="768" text-anchor="middle">grava só os vazios</text><path class="ln ds" d="M300 820L90 820" marker-end="url(#a2)"/><rect class="bg" x="125.0" y="799" width="140.0" height="18"/><text class="t sm" x="195.0" y="812" text-anchor="middle">livro, fontes, aviso</text></svg>