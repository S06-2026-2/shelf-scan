version: '3.8'

services:
  # -----------------------------------------------------------------
  # Faixa de Portas: 8301 - 8320
  # -----------------------------------------------------------------
  ocr-service:
    build:
      context: ./services/ocr-service
      dockerfile: Dockerfile
    container_name: shelfscan-ocr-service
    restart: unless-stopped
    ports:
      - "8301:8301"
    environment:
      CORS_ORIGENS_PERMITIDAS: ${CORS_ORIGENS_PERMITIDAS:-http://localhost:5173}
    healthcheck:
      # /health só responde 200 com o modelo EAST carregado (o urllib dá erro no 503)
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8301/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # -----------------------------------------------------------------
  # Faixa de Portas: 8321 - 8340
  # -----------------------------------------------------------------
  neo4j:
    image: neo4j:5-community
    container_name: shelfscan-neo4j
    restart: unless-stopped
    ports:
      - "8339:7474" # Painel Web Browser neo4j
      - "8340:7687" # Conexão Bolt do Driver Java
    environment:
      - NEO4J_AUTH=neo4j/shelfscan123
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  database-service:
    build:
      context: ./services/database-service
      dockerfile: Dockerfile
    container_name: shelfscan-database-service
    restart: unless-stopped
    ports:
      - "8321:8080" # Redireciona a 8321 do Host para a 8080 interna do Spring
    environment:
      - SPRING_NEO4J_URI=bolt://neo4j:7687
      - SPRING_NEO4J_AUTHENTICATION_USERNAME=neo4j
      - SPRING_NEO4J_AUTHENTICATION_PASSWORD=shelfscan123
    depends_on:
      - neo4j
  # -----------------------------------------------------------------
  # Faixa de Portas: 8341 - 8360
  # -----------------------------------------------------------------
  notification-db:
    image: postgres:16
    container_name: shelfscan-notification-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: shelf_scan_cliente
      POSTGRES_USER: notification_user
      POSTGRES_PASSWORD: notification_pass
    ports:
      - "8342:5432" # Host (8341)
    volumes:
      - notification_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification_user -d shelf_scan_cliente"]
      interval: 5s
      timeout: 5s
      retries: 10

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: shelfscan-notification-service
    restart: unless-stopped
    ports:
      - "8341:8341"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://notification-db:5432/shelf_scan_cliente
      SPRING_DATASOURCE_USERNAME: notification_user
      SPRING_DATASOURCE_PASSWORD: notification_pass
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      CORS_ORIGENS_PERMITIDAS: ${CORS_ORIGENS_PERMITIDAS:-http://localhost:5173}
    depends_on:
      notification-db:
        condition: service_healthy

volumes:
  notification_db_data:
  neo4j_data:
  neo4j_logs:
