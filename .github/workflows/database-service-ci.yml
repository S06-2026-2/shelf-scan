name: CI - Database Service

on:
  push:
    branches: [ "main", "dev" ]
    paths:
      - 'services/database-service/**'              # Executa se houver alteração nos arquivos desse serviço
      - '.github/workflows/ci-database-service.yml' # Executa se este próprio arquivo de CI for alterado
      
  pull_request:
    branches: [ "main", "dev" ]
    paths:
      - 'services/database-service/**'              
      - '.github/workflows/ci-database-service.yml' 

jobs:
  build-and-test:
    name: Build & Test (database-service)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/database-service # Move o terminal para pasta raiz do microsserviço antes de rodar os comandos

    steps:
      # clona o repositório do github
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      # instala e configura o ambiente Java JDK 25 necessário para o Spring Boot
      - name: Configurar JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'oracle'
          cache: 'maven'
          cache-dependency-path: 'services/database-service/pom.xml'

      - name: Dar permissão de execução ao Wrapper do Maven
        run: chmod +x mvnw

      - name: Compilar e Rodar Testes
        run: ./mvnw clean test

      - name: Validar Build da Imagem Docker
        run: docker build -t shelfscan/database-service:latest .
